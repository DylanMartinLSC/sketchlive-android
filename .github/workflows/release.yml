name: Release APK
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable debug signing key
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          test -n "$PREVIEW_KEYSTORE_BASE64" || { echo 'Configure PREVIEW_KEYSTORE_BASE64 with a backed-up Android debug keystore (password android).'; exit 1; }
          mkdir -p ~/.android
          printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      - name: Build debug-signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:lintRelease :app:assembleRelease -Psketchlive.sideloadPreview=true
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test actual APK launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/smoke-apk.sh
      - name: Stage stable assets
        run: |
          mkdir release
          cp app/build/outputs/apk/release/app-release.apk release/sketchlive-android.apk
          printf '%s\n' 'Release variant, signed with the Android debug key. Sideload preview; not Play Store signing. Model files download in the app. Reports are saved locally; email reporting is not configured.' > release/SIGNING.txt
          (cd release && zip sketchlive-android.zip sketchlive-android.apk SIGNING.txt)
          python -c "from pathlib import Path; assert all(p.stat().st_size < 2_000_000_000 for p in Path('release').iterdir())"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-debug-signed
          path: release/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
